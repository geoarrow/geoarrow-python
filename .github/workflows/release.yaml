name: release

on:
  push:
    tags:
      - "geoarrow-types-*"
      - "geoarrow-pyarrow-*"
      - "geoarrow-pandas-*"

permissions:
  contents: read

jobs:
  select-package:
    runs-on: ubuntu-latest

    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^(geoarrow-types|geoarrow-pyarrow|geoarrow-pandas)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          echo "package=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  build:
    needs: select-package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build ${{ needs.select-package.outputs.package }}
        env:
          PACKAGE_DIR: ${{ needs.select-package.outputs.package }}
        run: python -m build --outdir dist "$PACKAGE_DIR"

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs:
      - select-package
      - build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.select-package.outputs.package }}

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
