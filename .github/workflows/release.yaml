name: release

on:
  push:
    tags:
      - "geoarrow-types-*"
      - "geoarrow-pyarrow-*"
      - "geoarrow-pandas-*"

permissions:
  contents: read

jobs:
  select-package:
    runs-on: ubuntu-latest

    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^(geoarrow-types|geoarrow-pyarrow|geoarrow-pandas)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          echo "package=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  build:
    needs: select-package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify checked-out tag
        env:
          PACKAGE_DIR: ${{ needs.select-package.outputs.package }}
        run: |
          actual_tag="$(git describe --exact-match --tags --match="$PACKAGE_DIR-*")"
          if [[ "$actual_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::HEAD is tagged as $actual_tag, expected $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build ${{ needs.select-package.outputs.package }}
        env:
          PACKAGE_DIR: ${{ needs.select-package.outputs.package }}
        run: python -m build --outdir dist "$PACKAGE_DIR"

      - name: Verify distribution metadata
        env:
          EXPECTED_PACKAGE: ${{ needs.select-package.outputs.package }}
          EXPECTED_VERSION: ${{ needs.select-package.outputs.version }}
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"Expected one wheel, found: {wheels}")

          with ZipFile(wheels[0]) as wheel:
              metadata_paths = [
                  path for path in wheel.namelist()
                  if path.endswith(".dist-info/METADATA")
              ]
              if len(metadata_paths) != 1:
                  raise RuntimeError(
                      f"Expected one METADATA file, found: {metadata_paths}"
                  )
              metadata = email.message_from_bytes(wheel.read(metadata_paths[0]))

          actual = (metadata["Name"], metadata["Version"])
          expected = (os.environ["EXPECTED_PACKAGE"], os.environ["EXPECTED_VERSION"])
          if actual != expected:
              raise RuntimeError(f"Built {actual}, expected {expected}")
          PY

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs:
      - select-package
      - build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.select-package.outputs.package }}

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
